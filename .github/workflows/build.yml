name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug- und Release-APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Tagwerk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tagwerk-apk
          path: Tagwerk.apk

      - name: Als Download „latest“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Tagwerk.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Tagwerk – neueste Version" \
            --notes "Automatisch gebaut aus ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). APK auf dem Handy herunterladen und installieren."

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Tagwerk-apk

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App im Emulator testen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/screenshots.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/

      - name: Screenshots zum Release hinzufügen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest screenshots/*.png --clobber
